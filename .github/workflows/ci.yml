name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: kaviyo
          POSTGRES_USER: kaviyo
          POSTGRES_PASSWORD: kaviyo_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaviyo -d kaviyo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      KAVIYO_DB_URL: jdbc:postgresql://127.0.0.1:5432/kaviyo
      KAVIYO_DB_USER: kaviyo
      KAVIYO_DB_PASSWORD: kaviyo_local_only
      KAVIYO_HTTP_HOST: 127.0.0.1
      KAVIYO_HTTP_PORT: 8082
      KAVIYO_CRAWLER_ENABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f .gitignore
          test -f pom.xml
          test -x ./mvnw
          tracked_sensitive="$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|(^|/)id_(rsa|ed25519)$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_sensitive" ]]; then
            printf 'Potential secret file is tracked:\n%s\n' "$tracked_sensitive" >&2
            exit 1
          fi
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Build and run unit checks
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Start API in local demo mode
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress quarkus:dev -Dquarkus.http.port=8082 > /tmp/kaviyo-api.log 2>&1 &
          echo "$!" > /tmp/kaviyo-api.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8082/q/health > /tmp/kaviyo-health.json; then
              if grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' /tmp/kaviyo-health.json; then
                exit 0
              fi
            fi
            sleep 1
          done
          cat /tmp/kaviyo-api.log
          cat /tmp/kaviyo-health.json || true
          exit 1

      - name: Run API and PostgreSQL smoke checks
        run: ./scripts/smoke-backend.sh

      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/kaviyo-api.pid ]]; then
            kill "$(cat /tmp/kaviyo-api.pid)" 2>/dev/null || true
          fi
