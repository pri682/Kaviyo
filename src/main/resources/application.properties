# Local development is loopback-only. Change these explicitly for a deployed environment.
quarkus.http.host=${KAVIYO_HTTP_HOST:127.0.0.1}
quarkus.http.port=${KAVIYO_HTTP_PORT:8082}
quarkus.http.limits.max-body-size=1M
quarkus.smallrye-health.root-path=/q/health
quarkus.banner.enabled=false

# Persistence uses PostgreSQL. These local defaults are only for the synthetic demo database.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${KAVIYO_DB_USER:kaviyo}
quarkus.datasource.password=${KAVIYO_DB_PASSWORD:kaviyo_local_only}
quarkus.datasource.jdbc.url=${KAVIYO_DB_URL:jdbc:postgresql://127.0.0.1:5432/kaviyo}
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.max-size=8
quarkus.flyway.migrate-at-start=true

# Page scanning is only enabled by the local run script or an explicit deployment setting.
# Keep it disabled by default until workspace authentication and rate limiting are in place.
kaviyo.crawler.enabled=${KAVIYO_CRAWLER_ENABLED:false}
