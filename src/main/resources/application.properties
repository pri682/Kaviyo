# Local development is loopback-only. Change these explicitly for a deployed environment.
quarkus.http.host=${KAVIYO_HTTP_HOST:127.0.0.1}
quarkus.http.port=${KAVIYO_HTTP_PORT:8083}
quarkus.http.limits.max-body-size=1M
quarkus.smallrye-health.root-path=/q/health
quarkus.banner.enabled=false
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${KAVIYO_CORS_ORIGINS:http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8082,http://localhost:8082,http://127.0.0.1:8084,http://localhost:8084,http://127.0.0.1:8085,http://localhost:8085}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Kaviyo-Workspace-ID,X-Kaviyo-Confirm-Hash

# Persistence uses PostgreSQL. These local defaults are only for the synthetic demo database.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${KAVIYO_DB_USER:kaviyo}
quarkus.datasource.password=${KAVIYO_DB_PASSWORD:kaviyo_local_only}
quarkus.datasource.jdbc.url=${KAVIYO_DB_URL:jdbc:postgresql://127.0.0.1:5432/kaviyo}
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.max-size=8
quarkus.flyway.migrate-at-start=true

# Page scanning is only enabled by the local run script or an explicit deployment setting.
# Keep it disabled by default until workspace authentication and rate limiting are in place.
kaviyo.crawler.enabled=${KAVIYO_CRAWLER_ENABLED:false}
kaviyo.scan.worker.enabled=${KAVIYO_SCAN_WORKER_ENABLED:true}
kaviyo.scan.worker.poll-interval=${KAVIYO_SCAN_WORKER_POLL_INTERVAL:2s}

# Hosted production profile. A deployment must provide its own OIDC issuer, client ID,
# database URL and credentials. Never fall back to the seeded local database in prod.
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.cors.origins=${KAVIYO_CORS_ORIGINS}
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${KAVIYO_OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${KAVIYO_OIDC_CLIENT_ID}
%prod.quarkus.oidc.token.audience=${KAVIYO_OIDC_CLIENT_ID}
%prod.quarkus.http.auth.permission.api.paths=/api/v1/*
%prod.quarkus.http.auth.permission.api.policy=authenticated
%prod.quarkus.datasource.username=${KAVIYO_DB_USER}
%prod.quarkus.datasource.password=${KAVIYO_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${KAVIYO_DB_URL}
