services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaviyo}
      POSTGRES_USER: ${POSTGRES_USER:-kaviyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaviyo_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kaviyo-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kaviyo-postgres-data:
